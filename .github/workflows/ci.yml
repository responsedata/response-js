name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SDK packages
        run: pnpm test

      - name: Set up minimum supported server runtime
        uses: actions/setup-node@v6
        with:
          node-version: 18.17.0
          package-manager-cache: false

      - name: Test server packages on Node 18.17
        run: node --test packages/server/test/index.test.js packages/next/test/server.test.js
