name: Release npm Packages and CDN

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: response-js-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Require an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and versions
        run: pnpm release:verify "$GITHUB_REF_NAME"

      - name: Test SDK packages
        run: pnpm test

      - name: Publish unpublished package versions
        run: pnpm sdk:publish

      - name: Publish rolling and versioned CDN assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESPONSE_CDN_R2_BUCKET: response-js-cdn
        run: pnpm cdn:deploy
